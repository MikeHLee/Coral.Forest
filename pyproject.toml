[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coralforest"
version = "1.1.0"
description = "A reproducible rebuild of a 2018 random-forest model of coral bleaching, and a global atlas of reef heat stress and what it exposes in the communities nearby."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyreadr>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
atlas = ["ecoanalyst>=3.0", "matplotlib>=3.7"]
# only for `python -m coralforest.atlas.harvest --population`
population = ["rasterio>=1.3", "requests>=2.31"]

[project.scripts]
coralforest-evaluate = "coralforest.evaluate:main"
coralforest-atlas = "coralforest.atlas.build:main"
coralforest-harvest = "coralforest.atlas.harvest:main"

[tool.setuptools.packages.find]
include = ["coralforest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
